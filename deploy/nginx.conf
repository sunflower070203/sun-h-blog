resolver 127.0.0.11 valid=10s ipv6=off;

upstream sunny_api {
  zone sunny_api 64k;
  server api:3001 resolve;
}

upstream sunny_site_check {
  zone sunny_site_check 64k;
  server public-site:8081 resolve;
}

map $request_uri $article_api_path {
  ~^/posts/([^/?]+)(?:/index[.]html|/)?(?:[?].*)?$ /api/posts/$1;
  default /api/posts/%20;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 11m;
  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://sunny_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /media/ {
    alias /usr/share/nginx/media/;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  location = /admin {
    try_files /index.html =404;
  }

  location ^~ /admin/ {
    try_files /index.html =404;
  }

  location = /_published_article {
    internal;
    proxy_pass http://sunny_site_check$article_api_path;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_intercept_errors on;
    error_page 404 =403 @unpublished_article;
  }

  location @unpublished_article {
    return 403;
  }

  location ~ ^/posts/[^/]+(?:/index[.]html|/)?$ {
    root /var/www/sunny-public/current;
    auth_request /_published_article;
    auth_request_set $published_article_id $upstream_http_x_sunny_article_id;
    error_page 403 404 =404 /404.html;
    error_page 500 502 503 504 =503 @content_unavailable;
    add_header Cache-Control "no-store" always;
    try_files /_published/$published_article_id.html =404;
  }

  location ^~ /_published/ {
    internal;
    return 404;
  }

  location @content_unavailable {
    add_header Cache-Control "no-store" always;
    return 503;
  }

  location = /404.html {
    internal;
    root /var/www/sunny-public/current;
    add_header Cache-Control "no-store" always;
  }

  location ^~ /_astro/ {
    root /var/www/sunny-public/current;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri @previous_public_asset;
  }

  location @previous_public_asset {
    root /var/www/sunny-public/previous;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    root /var/www/sunny-public/current;
    error_page 404 /404.html;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
  }

  location ^~ /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location = /beian-police.png {
    expires 7d;
  }

  location = /sailboat.png {
    expires 7d;
  }
}
